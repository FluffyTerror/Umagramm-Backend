services:
  postgres:
    container_name: postgres-sql-umagramm
    image: postgres
    # Ставим дефолтные данные БД
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: gigapass1488
      # Хранилище где лежит БД
      PGDATA: /var/lib/postgresql/data
      # Имя БД
      POSTGRES_DB: Umagramm_DB
    volumes:
      - postgres:/data/postgres
    ports:
      - 5432:5432
    networks:
      - Umagramm_network
    restart: unless-stopped

  pgadmin:
    container_name: pgadmin-umagramm
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@umagramm.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - Umagramm_network
    restart: unless-stopped

networks:
  Umagramm_network:
    driver: bridge
volumes:
  postgres:
    driver: local

