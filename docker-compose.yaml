services:
  postgres:
    container_name: postgres-sql-umagramm
    image: postgres
    # Ставим дефолтные данные БД
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: gigapass1488
      # Хранилище где лежит БД
      PGDATA: /var/lib/postgresql/data
      # Имя БД
      POSTGRES_DB: Umagramm_DB
    volumes:
      - postgres:/data/postgres
    ports:
      - 5432:5432
    networks:
      - Umagramm_network
    restart: unless-stopped

  pgadmin:
    container_name: pgadmin-umagramm
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@umagramm.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - Umagramm_network
    restart: unless-stopped

    #по факту не нужен, но сделаю ради примера на вебе TODO убрать позже
  keycloak:
    container_name: keycloak-umagramm
    image: quay.io/keycloak/keycloak:26.0.0
    # тут указываю что вместо дефолтного 8080 использую 9090
    ports:
      - 9090:8080
    # Ставим дефолтные данные админа
    environment:
      KEYCLOAK_ADMIN: golshi
      KEYCLOAK_ADMIN_PASSWORD: golshi
    networks:
      - Umagramm_network
    command:
      - "start-dev"

networks:
  Umagramm_network:
    driver: bridge
volumes:
  postgres:
    driver: local

