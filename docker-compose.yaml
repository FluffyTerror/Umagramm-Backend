services:
  postgres:
    container_name: postgres-sql-umagramm
    image: postgres
    # Ставим дефолтные данные БД
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: gigapass1488
      # Хранилище где лежит БД
      PGDATA: /var/lib/postgresql/data
      # Имя БД
      POSTGRES_DB: umagramm_db
    volumes:
      - postgres:/data/postgres
    ports:
      - "5433:5432"
    networks:
      - Umagramm_network
    restart: unless-stopped

  redis-umagramm:
    image: redis:latest
    container_name: redis-umagramm
    ports:
      - "6379:6379"
    restart: unless-stopped

  pgadmin:
    container_name: pgadmin-umagramm
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@umagramm.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - Umagramm_network
    restart: unless-stopped

  minio:
    image: pgsty/minio
    container_name: minio-umagramm
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web Console
    environment:
      MINIO_ROOT_USER: "admin"
      MINIO_ROOT_PASSWORD: "supersecretpassword"
    volumes:
      - minio_storage:/data
    command: server /data --console-address ":9001"
    networks:
      - Umagramm_network
    restart: unless-stopped


networks:
  Umagramm_network:
    driver: bridge
volumes:
  minio_storage:
  postgres:
    driver: local

