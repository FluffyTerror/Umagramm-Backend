spring:
  jackson:
    serialisation:
      write-dates-as-timestamps: false
  r2dbc:
    url: r2dbc:postgresql://localhost:5433/umagramm_db
    username: postgres
    password: gigapass1488

  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5433/umagramm_db
    user: postgres
    password: gigapass1488
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Настройки кодеков для WebFlux (теперь они строго на уровне spring, а не внутри flyway)
  codec:
    max-in-memory-size: 15MB # Защитит от DataBufferLimitException при загрузке файлов

  data:
    redis:
      host: localhost # Когда бэк уедет в докер — поменяешь на имя контейнера redis-umagramm
      port: 6379

  springdoc:
    default-produces-media-type: application/json

logging:
  level:
    org.springframework.web: DEBUG


application:
  security:
    jwt:
      secret: ${JWT_SECRET:533c1a7b-deaf-4313-a1b2-ef6c9e34920f}
      access-token-ttl: 1h
      refresh-token-ttl: 60d

  minio:
    endpoint: http://localhost:9000
    access-key: admin
    secret-key: supersecretpassword # TODO: перед деплоем поменять!!!!!
    bucket-name: umagram-attachments

  file:
    uploads:
      media-output-path: ./uploads