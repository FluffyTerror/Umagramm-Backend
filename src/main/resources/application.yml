spring:
  r2dbc:
    url: r2dbc:postgresql://localhost:5433/umagramm_db
    username: postgres # Было username
    password: gigapass1488
  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5433/umagramm_db
    user: postgres     # Было username
    password: gigapass1488
    locations: classpath:db/migration
    baseline-on-migrate: true
    codec:
      multipart:
        # Размер одного куска (чанка). Если клиент шлет по 5-10 МБ, ставим с запасом.
        max-in-memory-size: 15MB
        max-disk-usage-per-part: 15MB
        max-parts: 5 # В одном запросе будет только 1 файл-чанк и метаданные
  springdoc:
    default-produces-media-type: application/json
  logging:
    level:
      org.springframework.web: DEBUG
  data:
    redis:
      host: localhost # когда бэк будет тоже в докере - поменять
      port: 6379

application:
  security:
    jwt:
      secret: ${JWT_SECRET:533c1a7b-deaf-4313-a1b2-ef6c9e34920f}
      access-token-ttl: 1h
      refresh-token-ttl: 60d

  file:
    uploads:
      media-output-path: ./uploads

