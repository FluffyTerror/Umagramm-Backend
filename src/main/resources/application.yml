    jwt:
      secret: ${JWT_SECRET:533c1a7b-deaf-4313-a1b2-ef6c9e34920f}
      access-token-ttl: 1h
      refresh-token-ttl: 60d

  file:
    uploads:
      media-output-path: ./uploads

