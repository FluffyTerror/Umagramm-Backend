spring:
  r2dbc:
    url: r2dbc:postgresql://localhost:5433/umagramm_db
    username: postgres # Было username
    password: gigapass1488
  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5433/umagramm_db
    user: postgres     # Было username
    password: gigapass1488
    locations: classpath:db/migration
    baseline-on-migrate: true
    spring:
      codec:
        multipart:
          # Лимит на один файл
          max-disk-usage-per-part: 2GB
          # Общий лимит на весь запрос (если файлов несколько)
          max-in-memory-size: 50MB
  springdoc:
    default-produces-media-type: application/json
  logging:
    level:
      org.springframework.web: DEBUG
  data:
    redis:
      host: localhost # когда бэк будет тоже в докере - поменять
      port: 6379

application:
